<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área de Contato do Cliente - Suporte Tech</title>

    <meta name="description" content="Entre em contato com a equipe de suporte da Suporte Tech para enviar dúvidas e solicitações.">

    <meta property="og:title" content="Área de Contato do Cliente | Suporte Tech">
    <meta property="og:description" content="Envie sua mensagem para nossa equipe de suporte.">
    <meta property="og:type" content="website">
</head>

<body>

<header>
    <h1>Área de Contato do Cliente</h1>

    <nav>
        <a href="#">Ajuda</a>
        <a href="#">Sair</a>
    </nav>
</header>

<main>

    <section>

        <article>
            <h2>Formulário de Suporte</h2>

            <p>Preencha os campos abaixo para entrar em contato com nossa equipe.</p>

            <form action="/enviar" method="POST">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required minlength="3">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required minlength="5">

                <label for="celular">Telefone Celular:</label>
                <input type="tel" id="celular" name="celular"
                       required pattern="[0-9]{11}" maxlength="11" inputmode="numeric">

                <label for="msg">Mensagem:</label>
                <textarea id="msg" name="msg" required></textarea>

                <button type="submit">Disparar Dados</button>

            </form>
        </article>

    </section>

    <aside>
        <p>Atendimento disponível em horário comercial.</p>
    </aside>

</main>

<footer>
    <p>Suporte Tech 2026</p>
</footer>

</body>

</html>
