<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário para contato da equipe de backend;">
    <title>Página</title>
</head>

<body>

    <header>
        <h1>Área de Contato do Cliente</h1>
        <nav>
            <ul>
                <li><a href="#">Ajuda</a></li>
                <li><a href="#">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Envie sua mensagem para a nossa equipe de suporte backend</h2>
            <article>
                <h3>Formulário de Contato</h3>
                <form action="/enviar" method="POST">
                    <label for="nome">Nome</label> <input required type="text" name="nome" id="nome" minlength="3"> <br>
                    <br>
                    <label for="email">Email</label> <input required type="email" name="email" id="email"> <br> <br>
                    <label for="telefone">Telefone</label> <input required type="tel" name="telefone" id="telefone"
                        pattern="[0-9]{11}">
                    <br> <br>
                    <label for="mensagem">Mensagem</label> <br>
                    <textarea name="mensagem" id="mensagem"></textarea> <br><br>
                    <button type="submit">Disparar Dados</button>
                </form>
            </article>
        </section>
    </main>

    <br>

    <footer>
        Suporte Tech 2026
    </footer>

</body>

</html>
