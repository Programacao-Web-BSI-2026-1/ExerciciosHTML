<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de Refatoração Semântica | Suporte Tech</title>
    
    <!-- SEO Tradicional -->
    <meta name="description" content="Portal de suporte técnico para envio de mensagens à equipe de backend. Implementação com foco em semântica, acessibilidade e padrões web.">
    <meta name="author" content="Gabriel Gama Baptista">
    
    <!-- Open Graph / Social SEO -->
    <meta property="og:title" content="Laboratório de Refatoração Semântica | Suporte Tech">
    <meta property="og:description" content="Envie sua mensagem para a nossa equipe de suporte backend de forma rápida e segura.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://portal1.iff.edu.br/cursos/ensino-superior/SistesmasdeInformacao2.jpg/@@images/60113ca9-fb0d-4cda-bd41-dbd5c0fb1b40.jpeg">
    <meta property="og:locale" content="pt_BR">
</head>

<body>
    <header>
        <h1>Área de Contato do Cliente</h1>
        <nav>
            <a href="#">Ajuda</a> | 
            <a href="#">Sair</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Envie sua mensagem para a nossa equipe de suporte backend</h2>
            <article>
                <form action="/enviar" method="POST">
                    <div>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required minlength="3" placeholder="Seu nome completo">
                    </div>
                    <br>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
                    </div>
                    <br>
                    <div>
                        <label for="celular">Telefone Celular:</label>
                        <input type="text" id="celular" name="celular" pattern="[0-9]{11}" required placeholder="Apenas números (11 dígitos)">
                    </div>
                    <br>
                    <div>
                        <label for="msg">Mensagem:</label>
                        <textarea id="msg" name="msg" placeholder="Como podemos ajudar?"></textarea>
                    </div>
                    <br>
                    <button type="submit">Disparar Dados</button>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Suporte Tech. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
