<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Grade Horária de Aulas do Módulo</title>
</head>
<body>
    
    <div class="bloco-cronograma">
        <h2 class="titulo-seccao">Horários Acadêmicos</h2>
        
        <table border="1">
            <caption>Grade de horários das disciplinas do módulo</caption>
            
            <thead>
                <tr>
                    <th>Aula</th>
                    <th>Horário</th>
                </tr>
            </thead>
            
            <tbody>
                <tr>
                    <td>Estruturação Multimídia</td>
                    <td>19:00 - 20:30</td>
                </tr>
            </tbody>
        </table>
        
        <p>Recursos necessários:</p>
        <ul>
            <li>Computador com IDE configurada</li>
            <li>Arquivos de legenda (.vtt) prontos</li>
        </ul>
    </div>

    <hr>

    <div class="bloco-video">
        <h2>Apresentação da Disciplina</h2>
        
        <video src="apresentacao.mp4" controls>
            <track src="legendas.vtt" kind="captions" srclang="pt" label="Português">
            Seu navegador não suporta a tag de vídeo.
        </video>
    </div>

    <div class="bloco-mapa">
        <h2>Localização do Campus IFF</h2>
        
        <iframe 
            src="https://mapas.iff.edu.br" 
            title="Mapa interativo com a localização do Campus IFF" 
            sandbox="allow-scripts allow-same-origin">
        </iframe>
    </div>

</body>
</html>
